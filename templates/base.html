<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SS - Struggle of Student{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header>
    <nav class="navbar">
        <a href="/" class="logo" aria-label="Struggle of Student home">
            <img src="{{ url_for('static', filename='images/ss-logo.png') }}" alt="Struggle of Student logo">
        </a>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/opportunities">Opportunities</a>
            <a href="/talent">Talent</a>
            <a href="/skills">Skills</a>
            <a href="/learning">Learning</a>
            <a href="/ambassador">Campus Ambassador</a>
            <a href="/roles">Roles</a>
            <a href="/events">Events</a>
            <a href="/contact">Contact</a>
            <a href="/register" class="nav-join">JOIN SS</a>
        </div>

        <button class="menu-button" aria-label="Open navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </nav>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer>
    <h2>SS</h2>
    <p>Struggle of Student</p>
    <p>Your Talent • Your Skills • Your Opportunity</p>
    <p>© 2026 Struggle of Student. All Rights Reserved.</p>
</footer>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
